; PlatformIO config for XiaoMiao LOCAL build using arduino-esp32 2.x core.
; This is the 2.x toolchain (espressif32@6.3.0, framework esp32@2.0.17) that the
; NES emulator project uses and on which SdFat 2.2.0 reads the shared-SPI SD card
; WITHOUT crashing (the 3.x core's SPIClass crashes SdFat).
; Build with: pio run -e xiaomiao
[platformio]
src_dir = esp32_marauder
default_envs = xiaomiao

[env:xiaomiao]
platform = espressif32@6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions/min_spiffs.csv
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

build_flags =
    -DMARAUDER_XIAOMIAO
    -D CORE_DEBUG_LEVEL=0
    -Wl,-zmuldefs
; -Wl,-zmuldefs mirrors the CI workflow's platform.txt patch: several Marauder
; headers (EvilPortal.h index_html, utils.h base64Encode, WiFiScan raw-frame
; check) define symbols in the header, so each TU that includes them emits a
; definition. Allowing multiple definitions links them (CI does the same).

; Inject User_Setup_xiaomiao.h into TFT_eSPI (mirrors the CI workflow step
; "Configure TFT_eSPI for XiaoMiao"). ST7735 + shared-SPI MISO on GPIO19 needs
; TFT_RST=-1 so GPIO19 stays MISO for the SD card.
extra_scripts = pre:tools_local/apply_tft_setup.py

; Libraries pinned to 2.x-compatible versions (mirror build_xiaomiao_v2core.yml)
lib_deps =
    greiman/SdFat @ 2.2.0
    h2zero/NimBLE-Arduino @ 1.4.2
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/ivanseidel/LinkedList.git#v1.3.3
    adafruit/Adafruit BusIO @ 1.15.0
    adafruit/Adafruit GFX Library @ 1.11.9
    adafruit/Adafruit NeoPixel @ 1.12.0
    https://github.com/Bodmer/TFT_eSPI.git#V2.4.51
    https://github.com/plerup/espsoftwareserial.git#6.16.1
    https://github.com/marian-craciunescu/ESP32Ping.git#1.6
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/stevemarple/MicroNMEA.git#v2.0.6
    https://github.com/Bodmer/JPEGDecoder.git#1.8.0
    https://github.com/lvgl/lv_arduino.git#3.0.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    https://github.com/adafruit/Adafruit_MAX1704X.git#1.0.2

[env]
