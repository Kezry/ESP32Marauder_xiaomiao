name: Build XiaoMiao

# Single-board build for the XiaoMiao (学而思小喵掌机) target.
# Mirrors build_parallel.yml but builds ONLY XiaoMiao (cheap, fast).
# Sketch-bundled libraries under esp32_marauder/libraries/ are the source of truth
# for TFT_eSPI / NimBLE / lv_arduino / etc. — exactly how upstream builds screen boards.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/xiaomiao
    paths:
      - 'esp32_marauder/**'
      - 'User_Setup_xiaomiao.h'
      - 'User_Setup_Select.h'
      - '.github/workflows/build_xiaomiao.yml'

jobs:
  build:
    name: Build XiaoMiao firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Install ESP32 core v3.3.4
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4

      # Libraries NOT bundled in esp32_marauder/libraries/ — install from Library Manager
      - name: Install non-bundled dependencies
        run: |
          arduino-cli lib install "ESP32Ping"@1.6
          arduino-cli lib install "Adafruit NeoPixel"@1.12.0
          arduino-cli lib install "Adafruit BusIO"@1.15.0
          arduino-cli lib install "Adafruit MAX1704X"@1.0.2
          arduino-cli lib install "ArduinoJson"@6.18.2
          arduino-cli lib install "XPT2046 Touchscreen"@1.4.0
          arduino-cli lib install "MicroNMEA"@2.0.6
          arduino-cli lib install "Adafruit GFX Library"@1.11.9

      # Pinned-version deps that need a specific fork/commit (matched to upstream CI)
      - name: Checkout AsyncTCP
        uses: actions/checkout@v3
        with: { repository: ESP32Async/AsyncTCP, ref: v3.4.8, path: CustomAsyncTCP }
      - name: Checkout ESPAsyncWebServer (fork)
        uses: actions/checkout@v3
        with: { repository: bigbrodude6119/ESPAsyncWebServer, ref: master, path: CustomESPAsyncWebServer }
      - name: Checkout EspSoftwareSerial
        uses: actions/checkout@v3
        with: { repository: plerup/espsoftwareserial, ref: 8.1.0, path: CustomEspSoftwareSerial }

      - name: Place custom libs into Arduino library dir
        run: |
          arduino-cli config set directories.user "$HOME/Arduino"
          mkdir -p "$HOME/Arduino/libraries"
          for d in Custom*/; do cp -r "$d" "$HOME/Arduino/libraries/"; done
          # repo-bundled TCA8418 (used by some board configs)
          cp -r libraries/Adafruit_TCA8418 "$HOME/Arduino/libraries/" || true

      # TFT_eSPI is the one bundled in esp32_marauder/libraries/TFT_eSPI — configure THAT one
      # (this is how upstream CI handles every screen board: mini, m5stickc, cyd, etc.)
      - name: Configure bundled TFT_eSPI for XiaoMiao
        run: |
          TFT="esp32_marauder/libraries/TFT_eSPI"
          cp User_*.h "$TFT/"
          sed -i 's|^//#include <User_Setup_xiaomiao.h>|#include <User_Setup_xiaomiao.h>|' "$TFT/User_Setup_Select.h"
          echo "--- active setup line: ---"
          grep -nE "^#include <User_Setup" "$TFT/User_Setup_Select.h"

      - name: Patch platform.txt (idf 3.x -Wl,-zmuldefs)
        run: |
          for i in $(find $HOME/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
            sed -i 's|compiler.c.elf.extra_flags=|compiler.c.elf.extra_flags=-Wl,-zmuldefs |' "$i"
          done

      - name: Compile XiaoMiao
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:d32:PartitionScheme=min_spiffs" \
            --build-property "compiler.cpp.extra_flags=-DMARAUDER_XIAOMIAO" \
            --warnings none \
            esp32_marauder/esp32_marauder.ino

      - name: Rename and locate artifact
        run: |
          VERSION=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_')
          DATE=$(date -u +%Y%m%d)
          BUILD_DIR=./esp32_marauder/build/esp32.esp32.d32
          INPUT_BIN=$BUILD_DIR/esp32_marauder.ino.bin
          OUTPUT_BIN=esp32_marauder_${VERSION}_${DATE}_xiaomiao.bin
          cp "$INPUT_BIN" "$OUTPUT_BIN"
          ls -la "$OUTPUT_BIN"
          echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao_firmware
          path: ${{ env.artifact_name }}
          retention-days: 14
