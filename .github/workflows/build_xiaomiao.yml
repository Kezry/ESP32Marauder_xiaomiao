name: Build XiaoMiao

# Single-board build for XiaoMiao (学而思小喵掌机).
# All libraries are installed EXPLICITLY via actions/checkout at pinned versions
# (mirroring upstream build_parallel.yml). The sketch-bundled submodule libs under
# esp32_marauder/libraries/ are NOT used — they are stale (e.g. TFT_eSPI submodule
# is 2.0.2 which lacks the 3-arg setTextColor Marauder needs).
on:
  workflow_dispatch:
  push:
    branches:
      - feat/xiaomiao

jobs:
  build:
    name: Build XiaoMiao firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing the compile-error log back to the branch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        # Do NOT init submodules: bundled esp32_marauder/libraries/* are stale and
        # we override every one with pinned Custom* checkouts below.

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Install ESP32 core v3.3.4
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4

      # ---- Every library via explicit checkout at CI-pinned versions ----
      - name: ESP32Ping
        uses: actions/checkout@v3
        with: { repository: marian-craciunescu/ESP32Ping, ref: 1.6, path: libs/ESP32Ping }
      - name: AsyncTCP
        uses: actions/checkout@v3
        with: { repository: ESP32Async/AsyncTCP, ref: v3.4.8, path: libs/AsyncTCP }
      - name: MicroNMEA
        uses: actions/checkout@v3
        with: { repository: stevemarple/MicroNMEA, ref: v2.0.6, path: libs/MicroNMEA }
      - name: ESPAsyncWebServer (repo-bundled, 2.10.4 — compatible with idf 3.3.4 mbedtls)
        # NOTE: bigbrodude6119@master (v1.2.3) uses mbedtls_md5_*_ret which is gone in
        # arduino-esp32 3.3.4's mbedtls. The repo-bundled 2.10.4 has version guards.
        run: |
          mkdir -p libs
          cp -r libraries/ESPAsyncWebServer libs/ESPAsyncWebServer
      - name: TFT_eSPI (V2.5.34 — has 3-arg setTextColor)
        uses: actions/checkout@v3
        with: { repository: Bodmer/TFT_eSPI, ref: V2.5.34, path: libs/TFT_eSPI }
      - name: XPT2046_Touchscreen
        uses: actions/checkout@v3
        with: { repository: PaulStoffregen/XPT2046_Touchscreen, ref: v1.4, path: libs/XPT2046_Touchscreen }
      - name: lv_arduino
        uses: actions/checkout@v3
        with: { repository: lvgl/lv_arduino, ref: 3.0.0, path: libs/lv_arduino }
      - name: JPEGDecoder
        uses: actions/checkout@v3
        with: { repository: Bodmer/JPEGDecoder, ref: 1.8.0, path: libs/JPEGDecoder }
      - name: NimBLE-Arduino
        uses: actions/checkout@v3
        with: { repository: h2zero/NimBLE-Arduino, ref: 2.3.8, path: libs/NimBLE-Arduino }
      - name: Adafruit_NeoPixel
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_NeoPixel, ref: 1.12.0, path: libs/Adafruit_NeoPixel }
      - name: ArduinoJson
        uses: actions/checkout@v3
        with: { repository: bblanchon/ArduinoJson, ref: v6.18.2, path: libs/ArduinoJson }
      - name: LinkedList
        uses: actions/checkout@v3
        with: { repository: ivanseidel/LinkedList, ref: v1.3.3, path: libs/LinkedList }
      - name: EspSoftwareSerial
        uses: actions/checkout@v3
        with: { repository: plerup/espsoftwareserial, ref: 8.1.0, path: libs/EspSoftwareSerial }
      - name: Adafruit_BusIO
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_BusIO, ref: 1.15.0, path: libs/Adafruit_BusIO }
      - name: Adafruit_MAX1704X
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_MAX1704X, ref: 1.0.2, path: libs/Adafruit_MAX1704X }
      - name: Adafruit_GFX
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit-GFX-Library, ref: 1.11.9, path: libs/Adafruit_GFX }
      # SwitchLib submodule is NOT included by Marauder code (uses local Switches.h), skip it.
      # Adafruit_TCA8418 is a real (non-submodule) dir at the repo top level.
      - name: Adafruit_TCA8418 (repo-bundled)
        run: |
          mkdir -p libs
          cp -r libraries/Adafruit_TCA8418 libs/Adafruit_TCA8418

      - name: Install libs into Arduino user library dir
        run: |
          arduino-cli config set directories.user "$HOME/Arduino"
          mkdir -p "$HOME/Arduino/libraries"
          cp -r libs/* "$HOME/Arduino/libraries/"
          # remove sketch-bundled submodule libs so they cannot shadow the pinned ones
          rm -rf esp32_marauder/libraries
          echo "--- installed libraries: ---"
          ls "$HOME/Arduino/libraries/"
          echo "--- TFT_eSPI version: ---"
          grep -i version "$HOME/Arduino/libraries/TFT_eSPI/library.properties"

      - name: Configure TFT_eSPI for XiaoMiao
        run: |
          TFT="$HOME/Arduino/libraries/TFT_eSPI"
          cp User_*.h "$TFT/"
          sed -i 's|^//#include <User_Setup_xiaomiao.h>|#include <User_Setup_xiaomiao.h>|' "$TFT/User_Setup_Select.h"
          echo "--- active TFT_eSPI setup: ---"
          grep -nE "^#include <User_Setup" "$TFT/User_Setup_Select.h"

      - name: Patch platform.txt (idf 3.x -Wl,-zmuldefs)
        run: |
          for i in $(find $HOME/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
            sed -i 's|compiler.c.elf.extra_flags=|compiler.c.elf.extra_flags=-Wl,-zmuldefs |' "$i"
          done

      - name: Build XiaoMiao
        run: |
          set -x
          BUILD_OUT="$GITHUB_WORKSPACE/build_out"
          mkdir -p "$BUILD_OUT"
          arduino-cli compile \
            --fqbn "esp32:esp32:d32:PartitionScheme=min_spiffs" \
            --build-path "$BUILD_OUT" \
            --build-property "compiler.cpp.extra_flags=-DMARAUDER_XIAOMIAO" \
            --warnings none \
            esp32_marauder/esp32_marauder.ino 2>&1 | tee /tmp/compile_output.log
          # verify the bin exists immediately after compile
          echo "=== POST-COMPILE: build_out .bin files ==="
          ls -la "$BUILD_OUT"/*.bin 2>&1 | tee -a /tmp/compile_output.log

      - name: Rename artifact
        run: |
          set -x
          exec 2>&1  # send stderr (set -x) to the log via tee below
          {
          DATE=$(date -u +%Y%m%d)
          OUTPUT_BIN=esp32_marauder_v0_0_8_${DATE}_xiaomiao.bin
          BUILD_OUT="$GITHUB_WORKSPACE/build_out"
          echo "=== build_out *.bin ==="
          ls -la "$BUILD_OUT"/*.bin 2>&1
          INPUT_BIN="$BUILD_OUT/esp32_marauder.ino.bin"
          if [ ! -f "$INPUT_BIN" ]; then
            echo "expected bin missing, searching build_out..."
            INPUT_BIN=$(find "$BUILD_OUT" -name "*.ino.bin" -type f | head -1)
          fi
          if [ -z "$INPUT_BIN" ] || [ ! -f "$INPUT_BIN" ]; then
            echo "NO BIN FOUND"; ls -laR "$BUILD_OUT" | head -50; exit 1
          fi
          cp "$INPUT_BIN" "$OUTPUT_BIN"
          ls -la "$OUTPUT_BIN"
          echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV
          # Also stage the matching bootloader + partitions (needed to flash; must
          # match the IDF version the app was built with).
          cp "$BUILD_OUT/esp32_marauder.ino.bootloader.bin" "bootloader_xiaomiao.bin" 2>/dev/null || echo "no bootloader in build_out"
          cp "$BUILD_OUT/esp32_marauder.ino.partitions.bin" "partitions_xiaomiao.bin" 2>/dev/null || echo "no partitions in build_out"
          ls -la bootloader_xiaomiao.bin partitions_xiaomiao.bin 2>/dev/null
          } 2>&1 | tee -a /tmp/compile_output.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao_firmware
          path: ${{ env.artifact_name }}
          retention-days: 14

      # Publish the firmware as GitHub Release v0.0.8 using the built-in GITHUB_TOKEN
      # (no user gh auth needed). softprops/action-gh-release is what upstream CI uses.
      - name: Create Release v0.0.8 with firmware
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.0.8
          name: XiaoMiao v0.0.8
          body: |
            ESP32 Marauder firmware for the 学而思小喵掌机 (XiaoMiao).

            - Target: ESP32-D0WD, 4MB flash, ST7735 128x160 (landscape)
            - Source: feat/xiaomiao branch (CI build ${{ github.run_id }})
            - Flash with esptool: `0x10000` = this .bin (plus bootloader/partitions/boot_app0)

            Full backup of factory firmware is in the repo at `doc/esp32_xiaomiao_factory_backup.bin`.
          files: |
            ${{ env.artifact_name }}
            bootloader_xiaomiao.bin
            partitions_xiaomiao.bin
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # Always commit the compile output + rename diagnostics back to the branch so
      # failures are readable via plain git (no gh auth needed).
      - name: Commit log + firmware to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p doc Release\ Bins
          cp /tmp/compile_output.log doc/last_compile_error.log
          {
            echo ""
            echo "=== artifact search (rename step) ==="
          } >> doc/last_compile_error.log
          # Also commit the built firmware bin so it can be pulled via git
          if [ -f "${{ env.artifact_name }}" ]; then
            cp "${{ env.artifact_name }}" "Release Bins/"
          fi
          git add doc/last_compile_error.log "Release Bins/" || true
          git commit -m "Update compile log + firmware (CI run ${{ github.run_id }})" || echo "nothing to commit"
          git push || echo "push skipped"
