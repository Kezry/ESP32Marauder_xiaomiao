name: Build XiaoMiao

# Single-board build for XiaoMiao (学而思小喵掌机).
# Uses ArminJo/arduino-test-compile EXACTLY like upstream build_parallel.yml so the
# sketch-bundled libraries (esp32_marauder/libraries/) are auto-discovered.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/xiaomiao

jobs:
  build:
    name: Build XiaoMiao firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Verify Installed Cores
        run: arduino-cli core list || true

      # Install ESP32 core at the pinned version via the same action upstream uses.
      # arduino-test-compile installs the platform itself, but we also need it for the
      # platform.txt patch step below, so install explicitly first.
      - name: Install ESP32 core v3.3.4
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4

      # ---- All dependencies via git checkout at CI-pinned versions (mirrors build_parallel.yml) ----
      - name: Install ESP32Ping
        uses: actions/checkout@v3
        with: { repository: marian-craciunescu/ESP32Ping, ref: 1.6, path: CustomESP32Ping }
      - name: Install AsyncTCP
        uses: actions/checkout@v3
        with: { repository: ESP32Async/AsyncTCP, ref: v3.4.8, path: CustomAsyncTCP }
      - name: Install MicroNMEA
        uses: actions/checkout@v3
        with: { repository: stevemarple/MicroNMEA, ref: v2.0.6, path: CustomMicroNMEA }
      - name: Install ESPAsyncWebServer (fork)
        uses: actions/checkout@v3
        with: { repository: bigbrodude6119/ESPAsyncWebServer, ref: master, path: CustomESPAsyncWebServer }
      - name: Install XPT2046_Touchscreen
        uses: actions/checkout@v3
        with: { repository: PaulStoffregen/XPT2046_Touchscreen, ref: v1.4, path: CustomXPT2046_Touchscreen }
      - name: Install JPEGDecoder
        uses: actions/checkout@v3
        with: { repository: Bodmer/JPEGDecoder, ref: 1.8.0, path: CustomJPEGDecoder }
      - name: Install Adafruit_NeoPixel
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_NeoPixel, ref: 1.12.0, path: CustomAdafruit_NeoPixel }
      - name: Install ArduinoJson
        uses: actions/checkout@v3
        with: { repository: bblanchon/ArduinoJson, ref: v6.18.2, path: CustomArduinoJson }
      - name: Install LinkedList
        uses: actions/checkout@v3
        with: { repository: ivanseidel/LinkedList, ref: v1.3.3, path: CustomLinkedList }
      - name: Install EspSoftwareSerial
        uses: actions/checkout@v3
        with: { repository: plerup/espsoftwareserial, ref: 8.1.0, path: CustomEspSoftwareSerial }
      - name: Install Adafruit_BusIO
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_BusIO, ref: 1.15.0, path: CustomAdafruit_BusIO }
      - name: Install Adafruit_MAX1704X
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_MAX1704X, ref: 1.0.2, path: CustomAdafruit_MAX1704X }
      - name: Install Adafruit_TCA8418 (repo-bundled)
        run: cp -r libraries/Adafruit_TCA8418 CustomAdafruit_TCA8418

      - name: Show libraries
        run: find "$HOME" -maxdepth 4 -name "Custom*" -type d 2>/dev/null | head -20

      # Configure the sketch-bundled TFT_eSPI (the one used in compilation) for XiaoMiao.
      - name: Configure bundled TFT_eSPI for XiaoMiao
        run: |
          TFT="esp32_marauder/libraries/TFT_eSPI"
          cp User_*.h "$TFT/"
          sed -i 's|^//#include <User_Setup_xiaomiao.h>|#include <User_Setup_xiaomiao.h>|' "$TFT/User_Setup_Select.h"
          echo "--- active TFT_eSPI setup: ---"
          grep -nE "^#include <User_Setup" "$TFT/User_Setup_Select.h"

      - name: Patch platform.txt (idf 3.x -Wl,-zmuldefs)
        run: |
          for i in $(find $HOME/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
            sed -i 's|compiler.c.elf.extra_flags=|compiler.c.elf.extra_flags=-Wl,-zmuldefs |' "$i"
          done

      # Use the SAME compile action as upstream build_parallel.yml so sketch-bundled
      # libraries under esp32_marauder/libraries/ are auto-discovered.
      - name: Build XiaoMiao
        uses: ArminJo/arduino-test-compile@v3.3.0
        with:
          sketch-names: esp32_marauder.ino
          arduino-board-fqbn: esp32:esp32:d32:PartitionScheme=min_spiffs
          extra-arduino-cli-args: "--warnings none --build-property compiler.cpp.extra_flags=-DMARAUDER_XIAOMIAO"
          arduino-platform: esp32:esp32@3.3.4
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/3.3.4/package_esp32_dev_index.json

      - name: Rename artifact
        run: |
          VERSION=$(grep '#define MARAUDER_VERSION' ./esp32_marauder/configs.h | sed -E 's/.*"v([^"]+)"/v\1/' | tr '.' '_')
          DATE=$(date -u +%Y%m%d)
          BUILD_DIR=./esp32_marauder/build/esp32.esp32.d32
          echo "--- build dir contents ---"
          ls -la "$BUILD_DIR"/ 2>/dev/null | head
          OUTPUT_BIN=esp32_marauder_${VERSION}_${DATE}_xiaomiao.bin
          cp "$BUILD_DIR/esp32_marauder.ino.bin" "$OUTPUT_BIN"
          ls -la "$OUTPUT_BIN"
          echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao_firmware
          path: ${{ env.artifact_name }}
          retention-days: 14
