name: Build XiaoMiao (2.x core)

# arduino-esp32 2.x build for XiaoMiao. The 3.x core's SPIClass crashes SdFat
# (EXCVADDR panics) on the shared GPIO19 RST/MISO bus, so SD is unreadable.
# The NES emulator project (same hardware) reads SD fine on espressif32@6.x
# (arduino-esp32 2.x) + SdFat 2.2.0, so we mirror that toolchain here.
#
# Differences vs build_xiaomiao.yml (3.x):
#  - core 2.0.17 instead of 3.3.4
#  - NimBLE 1.4.x (1.x API); HAS_NIMBLE_2 is auto-disabled via ESP_ARDUINO_VERSION
#    guard in configs.h, so the NimBLE-1.x code path in WiFiScan.cpp is taken
#  - me-no-dev AsyncTCP + ESPAsyncWebServer (2.x-compatible)
#  - outputs to Release Bins/ (same as before) + doc/last_compile_v2core.log
on:
  workflow_dispatch:
  push:
    branches:
      - feat/xiaomiao

jobs:
  build:
    name: Build XiaoMiao (2.x) firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Install ESP32 core v2.0.17
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      # ---- Libraries pinned to arduino-esp32 2.x-compatible versions ----
      - name: ESP32Ping
        uses: actions/checkout@v3
        with: { repository: marian-craciunescu/ESP32Ping, ref: 1.6, path: libs/ESP32Ping }
      # me-no-dev AsyncTCP (2.x core compatible), not the ESP32Async v3 fork. Has no
      # release tags, so use master.
      - name: AsyncTCP
        uses: actions/checkout@v3
        with: { repository: me-no-dev/AsyncTCP, ref: master, path: libs/AsyncTCP }
      - name: MicroNMEA
        uses: actions/checkout@v3
        with: { repository: stevemarple/MicroNMEA, ref: v2.0.6, path: libs/MicroNMEA }
      # me-no-dev ESPAsyncWebServer (2.x core compatible). No release tags, use master.
      - name: ESPAsyncWebServer
        uses: actions/checkout@v3
        with: { repository: me-no-dev/ESPAsyncWebServer, ref: master, path: libs/ESPAsyncWebServer }
      # TFT_eSPI V2.5.34 has the 3-arg setTextColor Marauder needs, and still
      # compiles on arduino-esp32 2.0.17 (the 2.x SPI issue is SD-only, not TFT).
      - name: TFT_eSPI
        uses: actions/checkout@v3
        with: { repository: Bodmer/TFT_eSPI, ref: V2.5.34, path: libs/TFT_eSPI }
      - name: XPT2046_Touchscreen
        uses: actions/checkout@v3
        with: { repository: PaulStoffregen/XPT2046_Touchscreen, ref: v1.4, path: libs/XPT2046_Touchscreen }
      - name: lv_arduino
        uses: actions/checkout@v3
        with: { repository: lvgl/lv_arduino, ref: 3.0.0, path: libs/lv_arduino }
      - name: JPEGDecoder
        uses: actions/checkout@v3
        with: { repository: Bodmer/JPEGDecoder, ref: 1.8.0, path: libs/JPEGDecoder }
      # NimBLE 1.x: HAS_NIMBLE_2 is OFF on 2.x core (configs.h guard), so the
      # NimBLE-1.x API path in WiFiScan.cpp is used. h2zero 1.4.x line.
      - name: NimBLE-Arduino
        uses: actions/checkout@v3
        with: { repository: h2zero/NimBLE-Arduino, ref: 1.4.2, path: libs/NimBLE-Arduino }
      - name: Adafruit_NeoPixel
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_NeoPixel, ref: 1.12.0, path: libs/Adafruit_NeoPixel }
      - name: ArduinoJson
        uses: actions/checkout@v3
        with: { repository: bblanchon/ArduinoJson, ref: v6.18.2, path: libs/ArduinoJson }
      - name: LinkedList
        uses: actions/checkout@v3
        with: { repository: ivanseidel/LinkedList, ref: v1.3.3, path: libs/LinkedList }
      - name: EspSoftwareSerial
        uses: actions/checkout@v3
        with: { repository: plerup/espsoftwareserial, ref: 6.16.1, path: libs/EspSoftwareSerial }
      - name: Adafruit_BusIO
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_BusIO, ref: 1.15.0, path: libs/Adafruit_BusIO }
      - name: Adafruit_MAX1704X
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit_MAX1704X, ref: 1.0.2, path: libs/Adafruit_MAX1704X }
      - name: Adafruit_GFX
        uses: actions/checkout@v3
        with: { repository: adafruit/Adafruit-GFX-Library, ref: 1.11.9, path: libs/Adafruit_GFX }
      # SdFat 2.2.0 — the whole point: reads the XiaoMiao SD on 2.x without crashing.
      - name: SdFat
        uses: actions/checkout@v3
        with: { repository: greiman/SdFat, ref: 2.2.0, path: libs/SdFat }
      - name: Adafruit_TCA8418 (repo-bundled)
        run: |
          mkdir -p libs
          cp -r libraries/Adafruit_TCA8418 libs/Adafruit_TCA8418

      - name: Install libs into Arduino user library dir
        run: |
          arduino-cli config set directories.user "$HOME/Arduino"
          mkdir -p "$HOME/Arduino/libraries"
          cp -r libs/* "$HOME/Arduino/libraries/"
          rm -rf esp32_marauder/libraries
          echo "--- installed libraries: ---"
          ls "$HOME/Arduino/libraries/"
          echo "--- TFT_eSPI version: ---"
          grep -i version "$HOME/Arduino/libraries/TFT_eSPI/library.properties" || true
          echo "--- core version: ---"
          ls "$HOME/.arduino15/packages/esp32/hardware/esp32/"

      - name: Configure TFT_eSPI for XiaoMiao
        run: |
          TFT="$HOME/Arduino/libraries/TFT_eSPI"
          cp User_*.h "$TFT/"
          sed -i 's|^//#include <User_Setup_xiaomiao.h>|#include <User_Setup_xiaomiao.h>|' "$TFT/User_Setup_Select.h"
          echo "--- active TFT_eSPI setup: ---"
          grep -nE "^#include <User_Setup" "$TFT/User_Setup_Select.h"

      - name: Patch platform.txt (-Wl,-zmuldefs for duplicate symbols)
        run: |
          for i in $(find $HOME/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
            sed -i 's|compiler.c.elf.extra_flags=|compiler.c.elf.extra_flags=-Wl,-zmuldefs |' "$i"
          done

      - name: Build XiaoMiao (2.x)
        run: |
          set -x
          BUILD_OUT="$GITHUB_WORKSPACE/build_out"
          mkdir -p "$BUILD_OUT"
          arduino-cli compile \
            --fqbn "esp32:esp32:d32:PartitionScheme=min_spiffs" \
            --build-path "$BUILD_OUT" \
            --build-property "compiler.cpp.extra_flags=-DMARAUDER_XIAOMIAO" \
            --warnings none \
            esp32_marauder/esp32_marauder.ino 2>&1 | tee /tmp/compile_output.log
          echo "=== POST-COMPILE: build_out .bin files ==="
          ls -la "$BUILD_OUT"/*.bin 2>&1 | tee -a /tmp/compile_output.log

      - name: Rename artifact
        run: |
          set -x
          exec 2>&1
          {
          DATE=$(date -u +%Y%m%d)
          OUTPUT_BIN=esp32_marauder_v2core_${DATE}_xiaomiao.bin
          BUILD_OUT="$GITHUB_WORKSPACE/build_out"
          echo "=== build_out *.bin ==="
          ls -la "$BUILD_OUT"/*.bin 2>&1
          INPUT_BIN="$BUILD_OUT/esp32_marauder.ino.bin"
          if [ ! -f "$INPUT_BIN" ]; then
            echo "expected bin missing, searching build_out..."
            INPUT_BIN=$(find "$BUILD_OUT" -name "*.ino.bin" -type f | head -1)
          fi
          if [ -z "$INPUT_BIN" ] || [ ! -f "$INPUT_BIN" ]; then
            echo "NO BIN FOUND"; ls -laR "$BUILD_OUT" | head -50; exit 1
          fi
          cp "$INPUT_BIN" "$OUTPUT_BIN"
          ls -la "$OUTPUT_BIN"
          echo "artifact_name=$OUTPUT_BIN" >> $GITHUB_ENV
          # matching bootloader + partitions (must match the 2.x IDF build)
          cp "$BUILD_OUT/esp32_marauder.ino.bootloader.bin" "bootloader_xiaomiao_v2core.bin" 2>/dev/null || echo "no bootloader in build_out"
          cp "$BUILD_OUT/esp32_marauder.ino.partitions.bin" "partitions_xiaomiao_v2core.bin" 2>/dev/null || echo "no partitions in build_out"
          ls -la bootloader_xiaomiao_v2core.bin partitions_xiaomiao_v2core.bin 2>/dev/null
          } 2>&1 | tee -a /tmp/compile_output.log

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao_firmware_v2core
          path: ${{ env.artifact_name }}
          retention-days: 14

      # Always commit the compile output + firmware to the branch so results are
      # readable via plain git (no gh auth needed). Rebase on remote first so the
      # push doesn't get rejected by concurrent commits.
      - name: Commit log + firmware to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p doc
          # save the log even if empty
          cp /tmp/compile_output.log doc/last_compile_v2core.log 2>/dev/null || echo "no compile_output.log" > doc/last_compile_v2core.log
          # fetch + rebase so we never reject-push
          git fetch origin feat/xiaomiao
          git checkout feat/xiaomiao 2>/dev/null || git checkout -B feat/xiaomiao origin/feat/xiaomiao
          git add -A 2>/dev/null || true
          git commit -m "Update 2.x compile log + firmware (CI run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin feat/xiaomiao 2>&1 || echo "push skipped"
